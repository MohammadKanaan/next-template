name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: next_template_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      # The example file already points at localhost:5432/next_template_test and Redis database 15,
      # which is where the service containers above listen.
      - name: Write .env.test
        run: cp .env.test.example .env.test
      - run: bun run db:test:prepare
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      # The build imports the auth module, which refuses to load without a secret in production
      # mode. This value is a placeholder: nothing at build time uses it.
      - run: bun run build
        env:
          BETTER_AUTH_SECRET: build-only-placeholder-never-used-at-runtime
