services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: next_template_dev
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql

  redis:
    image: redis:7-alpine
    # volatile-lru evicts only keys with a TTL (cached entries, rate-limit counters), never the
    # TTL-less tag versions that invalidate the cache.
    command: ['redis-server', '--maxmemory', '256mb', '--maxmemory-policy', 'volatile-lru']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

  # The upstream minio/minio and minio/mc images are no longer published, hence Chainguard's builds.
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data

  # One-shot: creates the bucket and makes `avatars/` publicly downloadable.
  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    depends_on:
      - minio
    entrypoint: ['/bin/sh', '-c']
    command:
      - >
        until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done &&
        mc mb --ignore-existing local/next-template &&
        mc anonymous set download local/next-template/avatars
    restart: 'no'

volumes:
  db-data:
  redis-data:
  minio-data:
