# `docker compose up -d` starts only the infrastructure (db, redis), for local development with
# `bun run dev` and `bun run dev:worker`. `docker compose --profile app up --build` also builds the
# app image and runs the migrations, the web process and the worker (see "Docker" in
# docs/guides/getting-started.md).

# Environment shared by the app containers. Inside compose the services reach each other by service
# name. A variable from the shell or from `.env` overrides the `${NAME:-default}` fallbacks below.
# BETTER_AUTH_SECRET has no fallback: it is required, and compose refuses to start the app profile
# without it (a shared default would let anyone forge verification links). Compose interpolates the
# whole file, so even `docker compose up -d` needs it set (generate it: openssl rand -base64 32).
x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://postgres:postgres@db:5432/next_template_dev
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env (openssl rand -base64 32)}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
  REDIS_URL: redis://redis:6379/0
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  EMAIL_FROM: ${EMAIL_FROM:-Next Template <noreply@example.com>}
  # Google sign-in is on only when both are set (redirect URI: <BETTER_AUTH_URL>/api/auth/callback/google).
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  # Uploads (Cloudflare R2) are on only when all five are set (see .env.example).
  R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
  R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
  R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
  R2_BUCKET: ${R2_BUCKET:-}
  R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: next_template_dev
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d next_template_dev']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # volatile-lru evicts only keys with a TTL (cached entries, rate-limit counters), never the
    # TTL-less tag versions that invalidate the cache.
    command: ['redis-server', '--maxmemory', '256mb', '--maxmemory-policy', 'volatile-lru']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies the Prisma migrations, then installs or upgrades the `pgboss` schema.
  # Seeding stays an explicit command because the seed replaces rows:
  #   docker compose --profile app run --rm -e ALLOW_SEED=1 migrate bun run db:seed
  migrate:
    profiles: ['app']
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Next Template}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
    image: next-template-app
    command:
      - sh
      - -c
      - bun run db:deploy && node_modules/.bin/tsx --tsconfig worker/tsconfig.json worker/migrate.ts
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  web:
    profiles: ['app']
    image: next-template-app
    command: ['bun', 'run', 'start']
    environment: *app-env
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      # The image has no curl; Node's fetch does the probe. 200 means PostgreSQL and Redis answer.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    profiles: ['app']
    image: next-template-app
    command: ['bun', 'run', 'worker']
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  db-data:
  redis-data:
